<!doctype html>
<html lang="en" data-theme="market">
  <head>
    <meta charset="utf-8" />
    <title>999 Market Search</title>
    <meta name="description" content="Fast, focused marketplace search for 999.md." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="999 Search" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('999scraper.ui.v1') || 'null')?.appearance;
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.colorMode = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#24252b' : '#f5f5f7';
      } catch {}
    </script>
  </head>

  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
