@if (toast(); as item) {
  <div
    class="app-toast alert"
    animate.enter="toast-enter"
    animate.leave="toast-leave"
    [class.error]="item.kind === 'error'"
    role="status"
    aria-live="polite"
  >
    <span class="toast-mark" aria-hidden="true">{{ item.kind === 'error' ? '!' : '✓' }}</span>
    {{ item.message }}
  </div>
}
@if (!pwa.online()) {
  <div class="network-state alert" animate.enter="banner-enter" animate.leave="banner-leave" role="status">
    <span aria-hidden="true"></span> Offline · saved app available
  </div>
}
@if (pwa.updateReady()) {
  <aside
    class="update-card alert"
    animate.enter="banner-enter"
    animate.leave="banner-leave"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <span class="update-mark" aria-hidden="true">↑</span>
    <div>
      <strong>Update ready</strong><small>{{ pwa.updateMessage() }}</small>
    </div>
    <button
      class="btn btn-primary btn-sm"
      type="button"
      (click)="pwa.reloadForUpdate()"
      [disabled]="pwa.applyingUpdate()"
    >
      {{ pwa.applyingUpdate() ? 'Updating…' : 'Refresh now' }}
    </button>
  </aside>
}
<app-nav />
<app-vin-research />
<router-outlet />
