@if (toast(); as item) {
  <div
    class="app-toast alert"
    animate.enter="toast-enter"
    animate.leave="toast-leave"
    [class.error]="item.kind === 'error'"
    role="status"
    aria-live="polite"
  >
    <span class="toast-mark" aria-hidden="true">{{ item.kind === 'error' ? '!' : '✓' }}</span>
    {{ item.message }}
  </div>
}
@if (!pwa.online()) {
  <div class="network-state alert" animate.enter="banner-enter" animate.leave="banner-leave" role="status">
    <span aria-hidden="true"></span> Offline · saved app available
  </div>
}
@if (pwa.updateReady()) {
  <aside
    class="update-card alert"
    animate.enter="update-enter"
    animate.leave="update-leave"
    [class.applying]="pwa.applyingUpdate()"
    [attr.aria-busy]="pwa.applyingUpdate()"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <span class="update-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M20 7v5a8 8 0 1 1-2.3-5.7L20 8.5" />
        <path d="M20 3v5.5h-5.5" />
      </svg>
    </span>
    <div class="update-copy">
      <span>APP UPDATE</span><strong>New version ready</strong><small>{{ pwa.updateMessage() }}</small>
    </div>
    <button
      class="btn btn-primary btn-sm"
      type="button"
      (click)="pwa.reloadForUpdate()"
      [disabled]="pwa.applyingUpdate()"
    >
      <span class="update-button-mark" aria-hidden="true"></span>
      {{ pwa.applyingUpdate() ? 'Restarting…' : 'Update now' }}
    </button>
  </aside>
}
