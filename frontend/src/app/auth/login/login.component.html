<main class="auth-card card bg-base-100 shadow-sm route-page">
  <h1>Log in</h1>
  <p>Enter your six-digit code.</p>
  <form autocomplete="on" (submit)="submit($event)">
    <label class="sr-only" for="login-code">Private login code</label>
    <input
      class="input input-bordered"
      id="login-code"
      name="password"
      type="password"
      inputmode="numeric"
      pattern="[0-9]{6}"
      maxlength="6"
      autocomplete="current-password"
      spellcheck="false"
      placeholder="000000"
      [value]="code()"
      (input)="updateCode($event)"
    />
    <button class="btn btn-primary" type="submit" [disabled]="code().length !== 6 || submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
  <div class="auth-alternative">
    <span>New here?</span>
    <a class="btn btn-ghost" routerLink="/register">Create a login code</a>
  </div>
</main>
