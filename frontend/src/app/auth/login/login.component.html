<main class="auth-card ui-surface">
  <h1>Log in</h1>
  <p>Enter your six-digit code.</p>
  <form (submit)="submit($event)">
    <label class="sr-only" for="login-code">Private login code</label>
    <input
      id="login-code"
      type="text"
      inputmode="numeric"
      pattern="[0-9]{6}"
      maxlength="6"
      autocomplete="one-time-code"
      spellcheck="false"
      placeholder="000000"
      [value]="code()"
      (input)="updateCode($event)"
    >
    <button class="ui-button ui-button-primary" type="submit" [disabled]="code().length !== 6 || submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
  <div class="auth-alternative">
    <span>New here?</span>
    <a class="ui-button ui-button-quiet" routerLink="/register">Create a login code</a>
  </div>
</main>
