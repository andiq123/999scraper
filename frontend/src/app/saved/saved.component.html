<main class="saved-page page-shell">
  <header class="page-heading"><p>Personal library</p><h1>Saved listings</h1><span>Keep promising finds in one quiet place.</span></header>
  @if (library.saved().length) {
    <div class="grid" animate.enter="reveal-enter" animate.leave="reveal-leave">
      @for (item of library.saved(); track item.product.id; let index = $index) {
        <app-product-card animate.leave="reveal-leave" [product]="item.product" [saved]="true" [eager]="index < 6" [priority]="index === 0" (save)="toggle($event)" />
      }
    </div>
  } @else {
    <section class="empty empty-state" animate.enter="reveal-enter" animate.leave="reveal-leave"><h2>Nothing saved yet</h2><p>Use the heart on any result to keep it here.</p><a class="ui-button ui-button-primary" routerLink="/">Start searching</a></section>
  }
</main>
