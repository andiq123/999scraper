<nav aria-label="Primary navigation" [class.authenticated]="auth.session()">
  <a
    routerLink="/"
    [routerLinkActiveOptions]="{
      paths: 'exact',
      queryParams: 'ignored',
      matrixParams: 'ignored',
      fragment: 'ignored',
    }"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <span class="tab-icon search-icon" aria-hidden="true"></span>
    <span>Search</span>
  </a>
  @if (auth.session()) {
    <a routerLink="/saved" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="tab-icon heart-icon" aria-hidden="true">♡</span>
      <span>Saved</span>
    </a>
  }
  <a
    [routerLink]="auth.session() ? '/account' : '/login'"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [attr.aria-label]="auth.session() ? 'Account' : 'Log in'"
  >
    <span class="tab-icon account-icon" aria-hidden="true"></span>
    <span>{{ auth.ready() && !auth.session() ? 'Log in' : 'Account' }}</span>
  </a>
</nav>
