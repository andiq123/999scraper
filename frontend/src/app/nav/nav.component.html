<nav aria-label="Primary navigation">
  <a
    routerLink="/"
    [routerLinkActiveOptions]="{
      paths: 'exact',
      queryParams: 'ignored',
      matrixParams: 'ignored',
      fragment: 'ignored',
    }"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <app-icon class="tab-icon" name="search" />
    <span>Search</span>
  </a>
  <a routerLink="/saved" routerLinkActive="active" ariaCurrentWhenActive="page">
    <app-icon class="tab-icon" name="heart" />
    <span>Saved</span>
  </a>
  <a routerLink="/account" [class.active]="accountActive()" [attr.aria-current]="accountActive() ? 'page' : null">
    <app-icon class="tab-icon" name="user" />
    <span>Account</span>
  </a>
</nav>
