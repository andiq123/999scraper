<nav class="ui-surface" aria-label="Primary navigation">
  <a class="brand" routerLink="/" aria-label="999Scraper home"><span>999</span><strong>Scraper</strong></a>
  <div class="actions">
    <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active">Search</a>
  @if (auth.session()) {
      <a animate.enter="reveal-enter" animate.leave="reveal-leave" routerLink="/saved" routerLinkActive="active">Saved</a>
      <a animate.enter="reveal-enter" animate.leave="reveal-leave" routerLink="/history" routerLinkActive="active">History</a>
      <button animate.enter="reveal-enter" animate.leave="reveal-leave" class="logout" type="button" (click)="auth.logout()">Log out</button>
  } @else {
      <a animate.enter="reveal-enter" animate.leave="reveal-leave" routerLink="/login" routerLinkActive="active">Log in</a>
  }
  </div>
</nav>
