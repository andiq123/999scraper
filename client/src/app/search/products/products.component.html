<div class="products">
  <form #form="ngForm" (submit)="onSubmit()">
    <div class="search-section">
      <input name="search" [(ngModel)]="searchCriteria" type="text" required placeholder="Search 999.md...">
      <button class="btn active" type="submit" [disabled]="form.invalid || loading">Search</button>
    </div>
  </form>

  <div class="stream-status" *ngIf="loading">
    <div class="stream-copy">
      <strong>Loading page {{ loadedPages || 1 }} of {{ totalPages || '?' }}</strong>
      <span>{{ products.length }} matching products received</span>
    </div>
    <div class="progress-track" role="progressbar" [attr.aria-valuenow]="progress" aria-valuemin="0" aria-valuemax="100">
      <span [style.width.%]="progress"></span>
    </div>
    <button class="btn" type="button" (click)="onCancel()">Cancel</button>
  </div>

  <div class="products-count-info" *ngIf="products.length > 0">
    <p><strong>{{ products.length }}</strong> products{{ loading ? ' so far' : '' }}</p>
  </div>

  <div class="products-container" *ngIf="products.length > 0">
    <app-product-item
      *ngFor="let product of products; trackBy: trackProduct"
      [product]="product">
    </app-product-item>
  </div>

  <div *ngIf="!initial && !loading && products.length === 0" class="noProducts">
    <h3>No products found. Try changing the filters.</h3>
  </div>

  <div class="initial-loading" *ngIf="loading && products.length === 0">
    <app-loading></app-loading>
  </div>
</div>
