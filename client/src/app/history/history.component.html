<main class="history page-shell">
  <header class="page-heading">
    <p class="eyebrow">Private activity</p>
    <h1>Search history</h1>
    <p>Your latest 200 searches, newest first.</p>
  </header>

  @if (items().length) {
    <ol>
      @for (item of items(); track item.id) {
        <li class="ui-surface"><a routerLink="/" [queryParams]="{q: item.query}">{{ item.query }}</a><time [attr.datetime]="item.searchedAt">{{ item.searchedAt | date:'medium' }}</time></li>
      }
    </ol>
  } @else {
    <div class="empty empty-state">
      <h2>No searches yet</h2>
      <p>Your searches will appear here.</p>
      <a class="button ui-button ui-button-primary" routerLink="/">Start searching</a>
    </div>
  }
</main>
