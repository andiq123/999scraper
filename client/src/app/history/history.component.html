<main class="history">
  <header>
    <p class="eyebrow">Private activity</p>
    <h1>Search history</h1>
    <p>Your latest 200 searches, newest first.</p>
  </header>

  @if (items().length) {
    <ol>
      @for (item of items(); track item.id) {
        <li><span>{{ item.query }}</span><time [attr.datetime]="item.searchedAt">{{ item.searchedAt | date:'medium' }}</time></li>
      }
    </ol>
  } @else {
    <div class="empty">
      <h2>No searches yet</h2>
      <p>Your searches will appear here.</p>
      <a class="button" routerLink="/search">Start searching</a>
    </div>
  }
</main>
