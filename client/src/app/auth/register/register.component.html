<div class="login">
  <div class="login-container">
    <ng-container *ngIf="!loginCode(); else registered">
      <h1>Create your login</h1>
      <p>Press once to create a private login code.</p>
      <button class="primary" type="button" (click)="createCode()" [disabled]="creating()">
        {{ creating() ? 'Creating…' : 'Register' }}
      </button>
    </ng-container>

    <ng-template #registered>
      <h1>Save this code</h1>
      <p>It is shown only now. There is no recovery if you lose it.</p>
      <code>{{ loginCode() }}</code>
      <button class="primary" type="button" (click)="copy()">{{ copied() ? 'Copied' : 'Copy code' }}</button>
      <a routerLink="/auth/login">Go to login</a>
    </ng-template>
  </div>
</div>
