<main class="auth-card ui-surface">
  @if (code()) {
    <h1>Your login code</h1>
    <p>Save these six digits. They are shown once.</p>
    <code aria-label="Your six-digit login code">{{ code() }}</code>
    <button class="ui-button ui-button-primary" type="button" (click)="copy()">{{ copied() ? 'Copied' : 'Copy code' }}</button>
    <a routerLink="/login">Go to login</a>
  } @else {
    <h1>Register</h1>
    <p>Create a private six-digit login code.</p>
    <button class="ui-button ui-button-primary" type="button" (click)="create()" [disabled]="creating()">
      {{ creating() ? 'Creating…' : 'Register' }}
    </button>
  }
</main>
