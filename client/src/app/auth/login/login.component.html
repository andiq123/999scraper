<div class="login">
  <div class="login-container">
    <h1>Welcome back</h1>
    <p>Enter your private login code.</p>
    <form autocomplete="off" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <input formControlName="code" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XX">
      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>
  </div>
</div>
