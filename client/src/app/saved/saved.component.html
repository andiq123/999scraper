<main class="saved-page">
  <header><p>Personal library</p><h1>Saved listings</h1><span>Keep promising finds in one quiet place.</span></header>
  @if (library.saved().length) {
    <div class="grid">
      @for (item of library.saved(); track item.product.id) {
        <app-product-card [product]="item.product" [saved]="true" (save)="toggle($event)" />
      }
    </div>
  } @else {
    <section class="empty"><h2>Nothing saved yet</h2><p>Use the heart on any result to keep it here.</p><a routerLink="/">Start searching</a></section>
  }
</main>
