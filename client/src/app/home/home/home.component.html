<div class="home">
    <div class="info">
        <h1>Search 999.md, simply</h1>
        <p>Fast progressive results and a private history tied only to your login code.</p>
    </div>

    <div *ngIf="!(session$ | async); else startSearching" class="buttons-container">
        <Button routerLink="/auth/login">Login</Button>
        <Button routerLink="/auth/register">Register</Button>
    </div>
    <ng-template #startSearching><div class="buttons-container"><button routerLink="/search">Start searching</button></div></ng-template>
</div>
