services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: 999scraper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d 999scraper"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      target: development
    init: true
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT:-8081}:8080
    environment:
      APP_ADDRESS: :8080
      DATABASE_URL: postgres://appuser:secret@db:5432/999scraper?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-key-change-me-please}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SCRAPER_MAX_PAGES: ${SCRAPER_MAX_PAGES:-25}
      SCRAPER_WORKERS: ${SCRAPER_WORKERS:-3}
      SCRAPER_REQUEST_DELAY: ${SCRAPER_REQUEST_DELAY:-350ms}
      SCRAPER_RETRIES: ${SCRAPER_RETRIES:-3}
    volumes:
      - .:/app
      - backend-build:/app/.air-tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: client
      target: development
    init: true
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-4200}:4200
    volumes:
      - ./client:/app
      - frontend-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Angular binds IPv4 in the development container; Alpine resolves localhost to IPv6 first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  backend-build:
  frontend-modules:
  postgres-data:
  redis-data:
