services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: 999scraper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d 999scraper"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - ${APP_PORT:-8080}:5000
    environment:
      DATABASE_URL: postgres://appuser:secret@db:5432/999scraper?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-key-change-me-please}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SCRAPER_MAX_PAGES: ${SCRAPER_MAX_PAGES:-25}
      SCRAPER_WORKERS: ${SCRAPER_WORKERS:-3}
      SCRAPER_REQUEST_DELAY: ${SCRAPER_REQUEST_DELAY:-350ms}
      SCRAPER_RETRIES: ${SCRAPER_RETRIES:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
