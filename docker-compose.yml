services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: 999scraper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d 999scraper"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: backend
      target: production
    restart: "no"
    entrypoint: ["./migrate"]
    environment:
      DATABASE_URL: postgres://appuser:secret@db:5432/999scraper?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: backend
      target: development
    init: true
    restart: unless-stopped
    ports:
      - 8081:8080
    env_file:
      - ./backend/.env
    environment:
      APP_ADDRESS: :8080
      DATABASE_URL: postgres://appuser:secret@db:5432/999scraper?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:?FRONTEND_PORT is required}
    volumes:
      - ./backend:/app
      - backend-build:/app/.air-tmp
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: frontend
      target: development
    init: true
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:?FRONTEND_PORT is required}:4200
    environment:
      API_URL: ${API_URL:?API_URL is required}
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Angular binds IPv4 in the development container; Alpine resolves localhost to IPv6 first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  backend-build:
  frontend-modules:
  postgres-data:
